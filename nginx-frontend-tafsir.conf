# /etc/nginx/sites-available/chatbot-tafsir.ift.my.id
# Reverse proxy ke container frontend React di port 3001

upstream chatbot_frontend {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream chatbot_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

# HTTP → redirect ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chatbot-tafsir.ift.my.id;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chatbot-tafsir.ift.my.id;

    # SSL — diisi otomatis oleh Certbot
    ssl_certificate     /etc/letsencrypt/live/chatbot-tafsir.ift.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatbot-tafsir.ift.my.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Gzip — kompresi JS/CSS/HTML
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;

    # API requests → backend FastAPI
    location /api/ {
        proxy_pass         http://chatbot_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeout lebih panjang untuk streaming SSE
        proxy_connect_timeout  10s;
        proxy_read_timeout     120s;
        proxy_send_timeout     120s;

        # Disable buffering untuk streaming response
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Semua request lain → container frontend
    location / {
        proxy_pass         http://chatbot_frontend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  10s;
        proxy_read_timeout     30s;
        proxy_send_timeout     30s;
    }

    # Logging
    access_log /var/log/nginx/chatbot-tafsir-frontend.access.log;
    error_log  /var/log/nginx/chatbot-tafsir-frontend.error.log;
}
