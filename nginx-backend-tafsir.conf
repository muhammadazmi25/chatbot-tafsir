# /etc/nginx/sites-available/backend-tafsir.ift.my.id
# Proxy ke container chatbot backend di port 8001

upstream chatbot_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

# HTTP → redirect ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name backend-tafsir.ift.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backend-tafsir.ift.my.id;

    # SSL — akan diisi Certbot
    ssl_certificate     /etc/letsencrypt/live/backend-tafsir.ift.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend-tafsir.ift.my.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_types application/json text/plain;

    # Proxy ke FastAPI backend
    location / {
        proxy_pass         http://chatbot_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeout lebih panjang — model BGE-M3 butuh waktu inference
        proxy_connect_timeout  60s;
        proxy_read_timeout     120s;
        proxy_send_timeout     120s;
    }

    # SSE streaming endpoint — disable buffering
    location /api/v1/chat/stream {
        proxy_pass         http://chatbot_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # WAJIB untuk SSE / streaming
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     300s;
        chunked_transfer_encoding on;

        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # Logging
    access_log /var/log/nginx/backend-tafsir.access.log;
    error_log  /var/log/nginx/backend-tafsir.error.log;
}
